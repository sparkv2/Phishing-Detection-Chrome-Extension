name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to exact commits (not movable version tags), so a hijacked tag can't change what runs here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntax-check every script
        run: for f in background.js src/*.js popup/*.js offscreen/*.js practice/*.js tools/*.mjs server/*.mjs; do node --check "$f"; done
      - name: Tests (analyzer, threat index, lessons, manifest)
        run: npm test
      - name: Build store packages
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-packages
          path: dist/*.zip

  # The extension loaded into a real Chrome on fake Gmail / Outlook / Yahoo pages (test/e2e/run.mjs).
  # Regular Chrome no longer accepts --load-extension, so this uses Chrome for Testing, Google's build for automation.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download Chrome for Testing (current stable)
        run: |
          url=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s).channels.Stable;console.log(j.downloads.chrome.find(x=>x.platform==='linux64').url)})")
          echo "Chrome for Testing: $url"
          curl -fsSL "$url" -o chrome.zip && unzip -q chrome.zip -d "$RUNNER_TEMP" && rm chrome.zip
          # Shared libraries Chrome needs that the runner image may lack.
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libgbm1 libasound2t64 > /dev/null || true
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Browser tests
        run: npm run test:e2e
