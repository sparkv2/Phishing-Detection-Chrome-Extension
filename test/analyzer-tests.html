<!doctype html>
<html><head><meta charset="utf-8"><title>Analyzer tests</title></head>
<body><pre id="out">Running…</pre>
<!-- Same cases as `node --test` (test/cases.js). Open in Chrome with file access allowed, or serve the folder. -->
<script src="../src/data.js"></script>
<script src="../src/analyzer.js"></script>
<script src="../src/intel.js"></script>
<script src="cases.js"></script>
<script>
const A = PG_Analyzer, I = PG_Intel, C = TW_CASES;
const out = [];
let pass = 0, fail = 0;
const fmt = (r) => `[${r.level} ${r.score}] ` + (r.signals.map((s) => `${s.id}(${s.weight})`).join(', ') || '-');
function record(ok, line) { ok ? pass++ : fail++; out.push(`${ok ? 'PASS' : 'FAIL'} ${line}`); }

for (const [name, input, expected, lists] of C.EMAILS) {
  try {
    const r = A.analyzeEmail(Object.assign({ context: 'open' }, input), lists || {});
    const ok = Array.isArray(expected) ? expected.includes(r.level) : r.level === expected;
    record(ok, `${name}${ok ? '' : ' (expected ' + expected + ')'}\n      ${fmt(r)}` + (r.summary ? `\n      summary: ${r.summary}` : ''));
  } catch (e) { record(false, `${name}: ${e.stack}`); }
}
for (const [u, bad] of C.URLS) { const r = A.analyzeUrl(u, {}); record((r.weight > 0) === bad, `url ${u} weight=${r.weight} ${r.signals.map((s) => s.id).join(',')}`); }
for (const [name, input, lists, cat] of C.THREATS) {
  const r = A.analyzeEmail(Object.assign({}, C.THREAT_BASE, input), lists);
  record(r.level === 'phishing' && r.threatCategory === cat && r.score === 0, `${name} ${fmt(r)}`);
}
for (const [raw, fields, domain, verdict] of C.AUTH_HEADERS) {
  const a = A.parseAuthResults(raw);
  const ok = (fields === null ? a === null : Object.entries(fields).every(([k, v]) => a && a[k] === v)) && A.authVerdict(a, domain) === verdict;
  record(ok, `auth headers -> ${verdict}: ${JSON.stringify(a)}`);
}

(async () => {
  try {
    const meta = await (await fetch('../data/threat-intel.meta.json')).json();
    const idx = I.parseCompact(await (await fetch('../data/threat-intel.bin')).arrayBuffer());
    const isBad = (host) => I.hostAndParents(host).some((h) => I.lookupCompact(idx, h) >= 0);
    out.push(`\nINDEX: ${idx.hi.length} entries from ${meta.sources.length} sources (generated ${meta.generated})`);
    const popular = ['mail.google.com', 'www.google.com', 'drive.google.com', 'docs.google.com', 'github.com', 'www.paypal.com', 'www.amazon.com',
      'www.chase.com', 'outlook.live.com', 'login.microsoftonline.com', 'bit.ly', 'vercel.app', 's3.amazonaws.com', 'mail.yahoo.com', 'www.irs.gov'];
    for (const h of popular) record(!isBad(h), `popular site not flagged: ${h}`);
    for (const s of meta.sources) record(s.count > 0 && (!s.sample || I.lookupCompact(idx, s.sample) >= 0), `source ${s.id}: ${s.count} entries, sample ${s.sample || '-'}`);
  } catch (e) { record(false, 'could not load the bundled threat list: ' + e); }
  out.unshift(`RESULT: ${pass} passed, ${fail} failed\n`);
  document.getElementById('out').textContent = out.join('\n');
})();
</script></body></html>
